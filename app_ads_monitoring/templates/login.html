{% extends "base.html" %}

{% block title %}Вход — app-ads.txt Monitor{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">

        <div class="text-center mb-4">
            <div class="mb-2">
                <span style="
                    font-size: 2rem;
                    font-weight: 700;
                    letter-spacing: -1px;
                    color: #212529;
                ">app-ads.txt</span>
                <span style="
                    font-size: 2rem;
                    font-weight: 300;
                    color: #6c757d;
                "> monitor</span>
            </div>
            <p class="text-muted small mb-0">
                Система мониторинга и валидации спецификаций
            </p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                {% if error %}
                <div class="alert alert-danger py-2 small">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('login') }}">

                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold text-muted">
                            ЛОГИН
                        </label>
                        <input
                            type="text"
                            class="form-control form-control-sm"
                            id="username"
                            name="username"
                            autofocus
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-semibold text-muted">
                            ПАРОЛЬ
                        </label>
                        <input
                            type="password"
                            class="form-control form-control-sm"
                            id="password"
                            name="password"
                            required
                        >
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark btn-sm py-2">
                            Войти
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <div class="mt-3 p-3 rounded small"
             style="background: #f8f9fa; border: 1px solid #e9ecef;">
            <div class="text-muted fw-semibold mb-1">Демо-доступ</div>
            <div class="d-flex justify-content-between">
                <span class="text-muted">analyst / analyst123</span>
                <span class="badge bg-dark">аналитик</span>
            </div>
            <div class="d-flex justify-content-between mt-1">
                <span class="text-muted">manager / manager123</span>
                <span class="badge bg-secondary">менеджер</span>
            </div>
        </div>

    </div>
</div>
{% endblock %}
